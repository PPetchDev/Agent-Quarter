<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>The Lounge v3</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #07041a;
        font-family: 'Segoe UI', sans-serif;
      }
      .app {
        width: 860px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 20px;
        background: rgba(7, 4, 26, 0.9);
        border-bottom: 1px solid rgba(240, 171, 252, 0.1);
      }
      .logo {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #f0abfc;
      }
      .logo em {
        color: #c8a8e8;
        font-style: normal;
      }
      .nav {
        flex: 1;
        display: flex;
        justify-content: center;
        gap: 3px;
      }
      .tab {
        font-size: 10px;
        font-weight: 600;
        padding: 4px 13px;
        border-radius: 6px;
        color: #4a3d62;
        cursor: pointer;
      }
      .tab.on {
        background: rgba(240, 171, 252, 0.12);
        color: #f0abfc;
        border: 1px solid rgba(240, 171, 252, 0.2);
      }
      .live-pill {
        font-size: 9px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(74, 222, 128, 0.1);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.2);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        animation: pulse 2s ease-in-out infinite;
      }
      .scene-wrap {
        position: relative;
        width: 860px;
        height: 500px;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
      .chars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .char {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: all;
        cursor: pointer;
        transform: translateX(-50%) translateY(-100%);
        transition: filter 0.2s;
      }
      .char:hover {
        filter: brightness(1.2);
      }
      .char:hover .ctag {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .cavatar {
        border-radius: 50%;
        border: 3px solid var(--b, rgba(240, 171, 252, 0.5));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs, 22px);
        background: var(--bg, linear-gradient(135deg, #ffd8ec, #c8a8e8));
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.6),
          0 0 var(--gs, 14px) var(--gc, rgba(240, 171, 252, 0.3));
        position: relative;
        overflow: hidden;
      }
      .cavatar::after {
        content: '';
        position: absolute;
        top: -20%;
        left: -20%;
        width: 50%;
        height: 50%;
        background: radial-gradient(ellipse, rgba(255, 255, 255, 0.2), transparent 70%);
        border-radius: 50%;
      }
      .cdot {
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid #07041a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6px;
        font-weight: 900;
      }
      .ctag {
        background: rgba(7, 4, 26, 0.92);
        border: 1px solid rgba(240, 171, 252, 0.2);
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 9px;
        font-weight: 700;
        color: #f0abfc;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(5px) scale(0.9);
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
        line-height: 1.5;
      }
      .ctag small {
        color: #7c6b99;
        font-size: 8px;
        font-weight: 400;
        display: block;
      }
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 20px;
        background: rgba(7, 4, 26, 0.9);
        border-top: 1px solid rgba(240, 171, 252, 0.07);
      }
      .pills {
        display: flex;
        gap: 5px;
      }
      .pill {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
      }
      .pg {
        background: rgba(74, 222, 128, 0.1);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.2);
      }
      .pp {
        background: rgba(240, 171, 252, 0.1);
        color: #f0abfc;
        border: 1px solid rgba(240, 171, 252, 0.2);
      }
      .py {
        background: rgba(148, 163, 184, 0.1);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .hint {
        font-size: 9px;
        color: #2d1f4a;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 5px #4ade80;
        }
        50% {
          opacity: 0.5;
          box-shadow: 0 0 10px #4ade80;
        }
      }
      .anim-w {
        animation: fw 2.5s ease-in-out infinite;
      }
      .anim-i {
        animation: fi 3.5s ease-in-out infinite;
      }
      .anim-l {
        animation: fl 3s ease-in-out infinite;
      }
      .anim-s {
        animation: fs 6s ease-in-out infinite;
        filter: brightness(0.55) saturate(0.4);
      }
      @keyframes fw {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 9px));
        }
      }
      @keyframes fi {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 6px));
        }
      }
      @keyframes fl {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 11px));
        }
      }
      @keyframes fs {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%) rotate(-3deg);
        }
        50% {
          transform: translateX(-50%) translateY(-100%) rotate(3deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="logo">✦ <em>SQUAD</em> ✧</div>
        <div class="nav">
          <div class="tab on">🏠 Lounge</div>
          <div class="tab">💬 Stages</div>
          <div class="tab">📋 Projects</div>
          <div class="tab">⚙️ Settings</div>
        </div>
        <div class="live-pill">
          <div class="dot"></div>
          3 active
        </div>
      </div>

      <div class="scene-wrap">
        <canvas id="c" width="860" height="500"></canvas>
        <div class="chars" id="chars"></div>
      </div>

      <div class="statusbar">
        <div class="pills">
          <span class="pill pg">● 3 active</span>
          <span class="pill pp">★ 1 leading</span>
          <span class="pill py">○ 2 idle 💤 2 sleeping</span>
        </div>
        <span class="hint">hover ตัวละคร · คลิกเพื่อเปิด Stage</span>
      </div>
    </div>

    <script>
      const cv = document.getElementById('c');
      const cx = cv.getContext('2d');

      // ── Projection ──────────────────────────────
      // Room: 9 wide (X), 7 deep (Y), 4.5 high (Z)
      // Origin: front-left-bottom
      const OX = 180,
        OY = 445,
        S = 40;
      function p(x, y, z) {
        return [OX + x * S + y * S * 0.5, OY - y * S * 0.5 - z * S];
      }

      // ── Draw helpers ────────────────────────────
      function poly(pts, fill, stroke, lw = 0.5) {
        cx.beginPath();
        cx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]);
        cx.closePath();
        if (fill) {
          cx.fillStyle = fill;
          cx.fill();
        }
        if (stroke) {
          cx.strokeStyle = stroke;
          cx.lineWidth = lw;
          cx.stroke();
        }
      }
      function rect4(a, b, c, d, f, s) {
        poly([a, b, c, d], f, s);
      }

      // Box: draw 3 faces of a box at (x,y,z) size (w,d,h)
      // top face, left face, right face
      function box(x, y, z, w, d, h, ct, cl, cr, stroke = 'rgba(0,0,0,0.15)') {
        // top (z+h)
        if (ct)
          rect4(
            p(x, y, z + h),
            p(x + w, y, z + h),
            p(x + w, y + d, z + h),
            p(x, y + d, z + h),
            ct,
            stroke,
          );
        // front face (y=y, varying x,z) — left face from viewer perspective
        if (cl) rect4(p(x, y, z), p(x + w, y, z), p(x + w, y, z + h), p(x, y, z + h), cl, stroke);
        // right face (x=x+w, varying y,z)
        if (cr)
          rect4(
            p(x + w, y, z),
            p(x + w, y + d, z),
            p(x + w, y + d, z + h),
            p(x + w, y, z + h),
            cr,
            stroke,
          );
      }

      // ── SCENE ───────────────────────────────────
      function draw() {
        cx.clearRect(0, 0, 860, 500);

        // ── Background sky ──
        const skyG = cx.createLinearGradient(0, 0, 0, 500);
        skyG.addColorStop(0, '#07041a');
        skyG.addColorStop(0.4, '#0e0628');
        skyG.addColorStop(1, '#1a1040');
        cx.fillStyle = skyG;
        cx.fillRect(0, 0, 860, 500);

        // Stars
        const stars = [
          [60, 30],
          [120, 15],
          [200, 40],
          [310, 20],
          [680, 25],
          [740, 40],
          [800, 15],
          [820, 55],
          [400, 10],
          [500, 35],
          [150, 60],
          [560, 18],
        ];
        stars.forEach(([sx, sy]) => {
          cx.beginPath();
          cx.arc(sx, sy, 1.2, 0, Math.PI * 2);
          cx.fillStyle = 'rgba(255,255,255,0.7)';
          cx.fill();
        });

        // Moon
        cx.beginPath();
        cx.arc(720, 38, 18, 0, Math.PI * 2);
        const mg = cx.createRadialGradient(714, 32, 2, 720, 38, 18);
        mg.addColorStop(0, '#fef3c7');
        mg.addColorStop(1, '#f59e0b');
        cx.fillStyle = mg;
        cx.fill();
        cx.beginPath();
        cx.arc(727, 34, 12, 0, Math.PI * 2);
        cx.fillStyle = '#0a0420';
        cx.fill();

        // ── Back wall ──
        const bwBL = p(0, 7, 0),
          bwBR = p(9, 7, 0),
          bwTR = p(9, 7, 4.5),
          bwTL = p(0, 7, 4.5);
        const bwG = cx.createLinearGradient(bwTL[0], bwTL[1], bwBL[0], bwBL[1]);
        bwG.addColorStop(0, '#e8e0fa');
        bwG.addColorStop(1, '#d5ccf0');
        poly([bwBL, bwBR, bwTR, bwTL], bwG, 'rgba(0,0,0,0.1)');

        // Baseboard back
        rect4(p(0, 7, 0), p(9, 7, 0), p(9, 7, 0.15), p(0, 7, 0.15), '#c8bcec', null);

        // ── Left wall ──
        const lwFL = p(0, 0, 0),
          lwBL = p(0, 7, 0),
          lwBT = p(0, 7, 4.5),
          lwFT = p(0, 0, 4.5);
        const lwG = cx.createLinearGradient(lwFT[0], lwFT[1], lwFL[0], lwFL[1]);
        lwG.addColorStop(0, '#f5f0ff');
        lwG.addColorStop(1, '#ede6ff');
        poly([lwFL, lwBL, lwBT, lwFT], lwG, 'rgba(0,0,0,0.08)');

        // Baseboard left
        rect4(p(0, 0, 0), p(0, 7, 0), p(0, 7, 0.15), p(0, 0, 0.15), '#d8d0f0', null);

        // ── Floor ──
        const flFL = p(0, 0, 0),
          flFR = p(9, 0, 0),
          flBR = p(9, 7, 0),
          flBL = p(0, 7, 0);
        const flG = cx.createLinearGradient(flFL[0], flFL[1], flBL[0], flBL[1]);
        flG.addColorStop(0, '#c8b8f5');
        flG.addColorStop(0.5, '#baaff0');
        flG.addColorStop(1, '#a89de8');
        poly([flFL, flFR, flBR, flBL], flG, 'rgba(0,0,0,0.06)');

        // Floor grid lines
        cx.strokeStyle = 'rgba(255,255,255,0.06)';
        cx.lineWidth = 0.8;
        for (let i = 1; i < 9; i++) {
          const a = p(i, 0, 0),
            b = p(i, 7, 0);
          cx.beginPath();
          cx.moveTo(a[0], a[1]);
          cx.lineTo(b[0], b[1]);
          cx.stroke();
        }
        for (let j = 1; j < 7; j++) {
          const a = p(0, j, 0),
            b = p(9, j, 0);
          cx.beginPath();
          cx.moveTo(a[0], a[1]);
          cx.lineTo(b[0], b[1]);
          cx.stroke();
        }

        // Rug (center)
        const rugPts = [p(2.5, 2, 0), p(6.5, 2, 0), p(6.5, 6, 0), p(2.5, 6, 0)];
        poly(rugPts, 'rgba(167,139,250,0.18)', null);
        poly(rugPts, null, 'rgba(167,139,250,0.3)', 1);

        // ── WINDOW (on left wall) ──
        // Window opening dark background
        const winPts = [p(0, 1.2, 0.9), p(0, 5.5, 0.9), p(0, 5.5, 3.8), p(0, 1.2, 3.8)];
        poly(winPts, '#0a0428', null);
        // Night sky gradient
        const wg = cx.createLinearGradient(
          p(0, 1.2, 3.8)[0],
          p(0, 1.2, 3.8)[1],
          p(0, 1.2, 0.9)[0],
          p(0, 1.2, 0.9)[1],
        );
        wg.addColorStop(0, '#0e0628');
        wg.addColorStop(1, '#1a1040');
        poly(winPts, wg, null);

        // City buildings in window
        const buildings = [
          [1.5, 3.5, 1.5],
          [2, 3.8, 2.5],
          [2.5, 4, 1.8],
          [3, 4.2, 2.2],
          [3.5, 3.7, 1.6],
          [4, 4.3, 2],
          [4.5, 3.6, 1.4],
          [5, 4.4, 1.9],
        ];
        buildings.forEach(([by, yd, bh]) => {
          const bx = 0,
            bz = 0;
          const bl = p(bx, by, bz),
            br = p(bx, by + 0.4, bz),
            tr = p(bx, by + 0.4, bz + bh * 0.6),
            tl = p(bx, by, bz + bh * 0.6);
          poly([bl, br, tr, tl], 'rgba(18,10,45,0.9)', null);
          // window lights
          cx.fillStyle = 'rgba(253,230,138,0.4)';
          cx.fillRect(tl[0] + 2, tl[1] + 4, 3, 2);
          cx.fillRect(tl[0] + 2, tl[1] + 8, 3, 2);
        });

        // Moon in window
        cx.beginPath();
        cx.arc(p(0, 4.2, 3.2)[0] + 2, p(0, 4.2, 3.2)[1], 7, 0, Math.PI * 2);
        const wmg = cx.createRadialGradient(
          p(0, 4.2, 3.2)[0],
          p(0, 4.2, 3.2)[1],
          1,
          p(0, 4.2, 3.2)[0] + 2,
          p(0, 4.2, 3.2)[1],
          7,
        );
        wmg.addColorStop(0, '#fef9c3');
        wmg.addColorStop(1, '#fde68a');
        cx.fillStyle = wmg;
        cx.fill();

        // Window frame outer
        cx.strokeStyle = '#d8cef5';
        cx.lineWidth = 4;
        const wf = [p(0, 1.2, 0.9), p(0, 5.5, 0.9), p(0, 5.5, 3.8), p(0, 1.2, 3.8)];
        cx.beginPath();
        cx.moveTo(wf[0][0], wf[0][1]);
        wf.forEach((pt) => cx.lineTo(pt[0], pt[1]));
        cx.closePath();
        cx.stroke();
        // Window dividers
        cx.lineWidth = 2.5;
        cx.strokeStyle = '#d8cef5';
        const wmid = p(0, 3.35, 0.9);
        const wmidt = p(0, 3.35, 3.8);
        cx.beginPath();
        cx.moveTo(wmid[0], wmid[1]);
        cx.lineTo(wmidt[0], wmidt[1]);
        cx.stroke();
        const whm = p(0, 1.2, 2.35);
        const whm2 = p(0, 5.5, 2.35);
        cx.beginPath();
        cx.moveTo(whm[0], whm[1]);
        cx.lineTo(whm2[0], whm2[1]);
        cx.stroke();

        // Curtains
        const cl1 = [p(0, 0.9, 0.7), p(0, 1.3, 0.7), p(0, 1.3, 3.9), p(0, 0.9, 3.9)];
        const cr1 = [p(0, 5.4, 0.7), p(0, 5.8, 0.7), p(0, 5.8, 3.9), p(0, 5.4, 3.9)];
        poly(cl1, 'rgba(255,245,255,0.7)', 'rgba(200,180,240,0.3)', 0.5);
        poly(cr1, 'rgba(255,245,255,0.7)', 'rgba(200,180,240,0.3)', 0.5);

        // ── BOOKSHELF ──
        // Main body
        box(2.8, 6.7, 0, 3.4, 0.3, 3.8, '#8b6030', '#6b4820', '#5a3a14');
        // Shelves
        [0.8, 1.6, 2.4, 3.2].forEach((sz) => {
          rect4(
            p(2.8, 6.7, sz),
            p(6.2, 6.7, sz),
            p(6.2, 7.0, sz),
            p(2.8, 7.0, sz),
            '#7a5428',
            'rgba(0,0,0,0.2)',
          );
        });
        // Books on shelves
        const bookColors = [
          '#ef4444',
          '#3b82f6',
          '#10b981',
          '#f59e0b',
          '#8b5cf6',
          '#ec4899',
          '#06b6d4',
          '#84cc16',
          '#f97316',
          '#6366f1',
        ];
        [0, 0.8, 1.6, 2.4].forEach((sz, si) => {
          let bx = 2.85;
          for (let b = 0; b < 9; b++) {
            const bw = 0.22 + Math.random() * 0.12;
            const bh = 0.55 + Math.random() * 0.2;
            const bc = bookColors[(si * 9 + b) % bookColors.length];
            // Book front face
            rect4(
              p(bx, 6.7, sz + 0.02),
              p(bx + bw, 6.7, sz + 0.02),
              p(bx + bw, 6.7, sz + 0.02 + bh),
              p(bx, 6.7, sz + 0.02 + bh),
              bc,
              null,
            );
            // Book side (dark)
            rect4(
              p(bx + bw, 6.7, sz + 0.02),
              p(bx + bw, 7.0, sz + 0.02),
              p(bx + bw, 7.0, sz + 0.02 + bh),
              p(bx + bw, 6.7, sz + 0.02 + bh),
              'rgba(0,0,0,0.3)',
              null,
            );
            bx += bw + 0.03;
            if (bx > 6.1) break;
          }
        });
        // Shelf top deco (small figurines/plants)
        box(3.0, 6.75, 3.8, 0.3, 0.2, 0.3, '#4ade80', '#22c55e', '#16a34a'); // tiny plant
        box(5.5, 6.75, 3.8, 0.3, 0.2, 0.4, '#f0abfc', '#d880e8', '#b060c0'); // figurine

        // ── CLOCK on back wall ──
        const clkPt = p(7.5, 7, 3);
        cx.beginPath();
        cx.arc(clkPt[0], clkPt[1], 16, 0, Math.PI * 2);
        cx.fillStyle = '#f5f0ff';
        cx.fill();
        cx.strokeStyle = '#9880e0';
        cx.lineWidth = 2;
        cx.stroke();
        // Clock face
        cx.strokeStyle = '#5040a0';
        cx.lineWidth = 1.5;
        cx.beginPath();
        cx.moveTo(clkPt[0], clkPt[1]);
        cx.lineTo(clkPt[0] + 6, clkPt[1] - 7);
        cx.stroke(); // hour
        cx.beginPath();
        cx.moveTo(clkPt[0], clkPt[1]);
        cx.lineTo(clkPt[0] + 10, clkPt[1] + 2);
        cx.stroke(); // minute

        // Picture frame on back wall
        const pfPt = [p(1.2, 7, 2.5), p(2.8, 7, 2.5), p(2.8, 7, 3.8), p(1.2, 7, 3.8)];
        poly(pfPt, '#f0e8ff', '#9880e0', 1.5);
        // Inner painting (abstract)
        const pfIn = [p(1.35, 7, 2.65), p(2.65, 7, 2.65), p(2.65, 7, 3.65), p(1.35, 7, 3.65)];
        poly(pfIn, '#ddd0ff', null);
        cx.fillStyle = '#f97316';
        cx.beginPath();
        cx.arc(p(1.8, 7, 3.1)[0], p(1.8, 7, 3.1)[1], 8, 0, Math.PI * 2);
        cx.fill();
        cx.fillStyle = '#3b82f6';
        cx.fillRect(p(2.1, 7, 3.1)[0] - 5, p(2.1, 7, 3.1)[1] - 10, 12, 14);

        // ── BED ──
        // Bed frame (wooden)
        box(5.8, 0.5, 0, 3.0, 5.0, 0.35, '#9b7030', '#7a5020', '#6a4018', 'rgba(0,0,0,0.2)');
        // Mattress
        box(5.85, 0.55, 0.35, 2.9, 4.9, 0.4, '#f0e8ff', '#e0d8f0', '#d0c8e0', 'rgba(0,0,0,0.1)');
        // Pillow
        box(5.9, 0.6, 0.75, 1.1, 1.1, 0.25, '#ffffff', '#f0eaff', '#e0d8f5', 'rgba(0,0,0,0.1)');
        box(7.2, 0.6, 0.75, 1.1, 1.1, 0.25, '#ffffff', '#f0eaff', '#e0d8f5', 'rgba(0,0,0,0.1)');
