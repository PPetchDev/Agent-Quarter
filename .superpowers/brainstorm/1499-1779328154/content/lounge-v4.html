<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>The Lounge v4</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #07041a;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
      }
      .app {
        width: 860px;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 22px;
        background: rgba(7, 4, 26, 0.95);
        border-bottom: 1px solid rgba(240, 171, 252, 0.1);
        backdrop-filter: blur(10px);
      }
      .logo {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #f0abfc;
        text-transform: uppercase;
      }
      .logo em {
        color: #c8a8e8;
        font-style: normal;
      }
      .nav {
        flex: 1;
        display: flex;
        justify-content: center;
        gap: 2px;
      }
      .tab {
        font-size: 10px;
        font-weight: 600;
        padding: 4px 14px;
        border-radius: 7px;
        color: #4a3d62;
        cursor: pointer;
        transition: all 0.15s;
      }
      .tab:hover:not(.on) {
        color: #7c6b99;
      }
      .tab.on {
        background: rgba(240, 171, 252, 0.12);
        color: #f0abfc;
        border: 1px solid rgba(240, 171, 252, 0.2);
      }
      .lpill {
        font-size: 9px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 99px;
        background: rgba(74, 222, 128, 0.1);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.2);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .ldot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        animation: lpulse 2s ease-in-out infinite;
      }
      @keyframes lpulse {
        0%,
        100% {
          box-shadow: 0 0 4px #4ade80;
        }
        50% {
          box-shadow: 0 0 10px #4ade80;
          opacity: 0.6;
        }
      }

      .scene {
        position: relative;
        width: 860px;
        height: 500px;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Characters */
      .ch {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        pointer-events: all;
        cursor: pointer;
        transform: translateX(-50%) translateY(-100%);
      }
      .ch:hover .ct {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .ch:hover .cr {
        transform: scale(1.2);
        opacity: 1;
      }
      .cr {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        border: 2px solid var(--rc, rgba(240, 171, 252, 0.6));
        box-shadow: 0 0 12px var(--rc, rgba(240, 171, 252, 0.4));
        transition: all 0.2s;
        pointer-events: none;
      }
      .ca {
        border-radius: 50%;
        border: var(--bw, 3px) solid var(--bc, rgba(240, 171, 252, 0.6));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs, 22px);
        background: var(--bg);
        position: relative;
        overflow: hidden;
        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.65),
          0 0 var(--gs, 0px) var(--gc, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        transition: transform 0.2s;
      }
      .ca::before {
        content: '';
        position: absolute;
        top: -30%;
        left: -15%;
        width: 55%;
        height: 55%;
        background: radial-gradient(ellipse, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
        border-radius: 50%;
      }
      .ch:hover .ca {
        transform: translateY(-4px) scale(1.05);
      }
      .cst {
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #07041a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 6px;
        font-weight: 900;
      }
      .ct {
        background: rgba(5, 2, 18, 0.92);
        border: 1px solid rgba(240, 171, 252, 0.2);
        border-radius: 8px;
        padding: 3px 10px;
        font-size: 9px;
        font-weight: 700;
        color: #f0abfc;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(6px) scale(0.9);
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        backdrop-filter: blur(6px);
        text-align: center;
        line-height: 1.5;
      }
      .ct small {
        color: #7c6b99;
        font-size: 8px;
        font-weight: 400;
        display: block;
      }

      .fw {
        animation: cfw 2.5s ease-in-out infinite;
      }
      .fi {
        animation: cfi 3.8s ease-in-out infinite;
      }
      .fl {
        animation: cfl 3s ease-in-out infinite;
      }
      .fs {
        animation: cfs 6s ease-in-out infinite;
      }
      @keyframes cfw {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 10px));
        }
      }
      @keyframes cfi {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 6px));
        }
      }
      @keyframes cfl {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%);
        }
        50% {
          transform: translateX(-50%) translateY(calc(-100% - 12px));
        }
      }
      @keyframes cfs {
        0%,
        100% {
          transform: translateX(-50%) translateY(-100%) rotate(-3deg);
        }
        50% {
          transform: translateX(-50%) translateY(-100%) rotate(3deg);
        }
      }

      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 22px;
        background: rgba(7, 4, 26, 0.95);
        border-top: 1px solid rgba(240, 171, 252, 0.07);
      }
      .pills {
        display: flex;
        gap: 5px;
      }
      .pi {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 9px;
        border-radius: 99px;
      }
      .pi-g {
        background: rgba(74, 222, 128, 0.1);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.2);
      }
      .pi-p {
        background: rgba(240, 171, 252, 0.1);
        color: #f0abfc;
        border: 1px solid rgba(240, 171, 252, 0.2);
      }
      .pi-s {
        background: rgba(148, 163, 184, 0.1);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .hint {
        font-size: 9px;
        color: #2d1f4a;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="logo">✦ <em>Squad</em> ✧</div>
        <div class="nav">
          <div class="tab on">🏠 Lounge</div>
          <div class="tab">💬 Stages</div>
          <div class="tab">📋 Projects</div>
          <div class="tab">⚙️ Settings</div>
        </div>
        <div class="lpill">
          <div class="ldot"></div>
          3 active
        </div>
      </div>

      <div class="scene">
        <canvas id="c" width="860" height="500"></canvas>
        <div id="hud"></div>
      </div>

      <div class="statusbar">
        <div class="pills">
          <span class="pi pi-g">● 3 active</span>
          <span class="pi pi-p">★ 1 lead</span>
          <span class="pi pi-s">○ 2 idle &nbsp;💤 2 sleeping</span>
        </div>
        <span class="hint">hover ตัวละคร · คลิกเพื่อเปิด Stage</span>
      </div>
    </div>

    <script>
      // ════════════════════════════════════════════
      //  PROJECTION  (cavalier axonometric)
      //  p(wx, wy, wz) → [screen_x, screen_y]
      //  wx = room width (right +)
      //  wy = room depth (back +)
      //  wz = height (up +)
      // ════════════════════════════════════════════
      const S = 40,
        OX = 188,
        OY = 445;
      const cv = document.getElementById('c'),
        X = cv.getContext('2d');
      function p(wx, wy, wz) {
        return [OX + wx * S + wy * S * 0.5, OY - wy * S * 0.5 - wz * S];
      }

      // ── Drawing helpers ──────────────────────────
      function poly(pts, fill, stroke, lw = 0.6) {
        X.beginPath();
        X.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]);
        X.closePath();
        if (fill) {
          X.fillStyle = fill;
          X.fill();
        }
        if (stroke) {
          X.strokeStyle = stroke;
          X.lineWidth = lw;
          X.stroke();
        }
      }
      function lgrad(x0, y0, x1, y1, ...stops) {
        const g = X.createLinearGradient(x0, y0, x1, y1);
        stops.forEach(([o, c]) => g.addColorStop(o, c));
        return g;
      }
      function rgrad(x, y, r0, r1, ...stops) {
        const g = X.createRadialGradient(x, y, r0, x, y, r1);
        stops.forEach(([o, c]) => g.addColorStop(o, c));
        return g;
      }

      // Draw isometric box – top + front + right faces
      // pos: (wx,wy,wz) = bottom-near-left corner, dim: (w,d,h)
      function box(wx, wy, wz, w, d, h, cT, cF, cR, stroke = 'rgba(0,0,0,.12)') {
        if (cT) {
          // top face
          poly(
            [
              p(wx, wy, wz + h),
              p(wx + w, wy, wz + h),
              p(wx + w, wy + d, wz + h),
              p(wx, wy + d, wz + h),
            ],
            cT,
            stroke,
          );
        }
        if (cF) {
          // front face (wy=const, facing viewer directly)
          poly(
            [p(wx, wy, wz), p(wx + w, wy, wz), p(wx + w, wy, wz + h), p(wx, wy, wz + h)],
            cF,
            stroke,
          );
        }
        if (cR) {
          // right face (wx+w = const)
          poly(
            [
              p(wx + w, wy, wz),
              p(wx + w, wy + d, wz),
              p(wx + w, wy + d, wz + h),
              p(wx + w, wy, wz + h),
            ],
            cR,
            stroke,
          );
        }
      }

      // Shadow on floor
      function shadow(wx, wy, w, d, alpha = 0.18) {
        X.save();
        X.globalAlpha = alpha;
        poly(
          [p(wx, wy, 0), p(wx + w, wy, 0), p(wx + w, wy + d, 0), p(wx, wy + d, 0)],
          'rgba(40,20,80,.6)',
          null,
        );
        X.restore();
      }

      // ════════════════════════════════════════════
      //  MAIN DRAW
      // ════════════════════════════════════════════
      function draw() {
        X.clearRect(0, 0, 860, 500);

        // ── 1. Sky background ──────────────────
        const skyG = lgrad(
          0,
          0,
          0,
          500,
          [0, '#060418'],
          [0.35, '#0e0628'],
          [0.7, '#160c38'],
          [1, '#1a1040'],
        );
        X.fillStyle = skyG;
        X.fillRect(0, 0, 860, 500);

        // Stars
        [
          [55, 22, 1.1],
          [88, 12, 0.9],
          [160, 30, 1.2],
          [240, 16, 0.8],
          [330, 28, 1],
          [420, 8, 1.3],
          [520, 22, 0.9],
          [610, 14, 1.1],
          [690, 30, 1],
          [760, 12, 0.8],
          [810, 24, 1.2],
          [830, 8, 0.7],
        ].forEach(([sx, sy, sr]) => {
          const a = 0.5 + Math.random() * 0.5;
          X.beginPath();
          X.arc(sx, sy, sr, 0, Math.PI * 2);
          X.fillStyle = `rgba(255,255,255,${a})`;
          X.fill();
        });

        // Moon (upper right, above window area)
        const mx = 670,
          my = 40;
        const moonG = rgrad(
          mx - 6,
          my - 5,
          2,
          mx,
          my,
          22,
          [0, '#fff8e0'],
          [0.5, '#fde68a'],
          [1, '#f4a020'],
        );
        X.beginPath();
        X.arc(mx, my, 22, 0, Math.PI * 2);
        X.fillStyle = moonG;
        X.fill();
        // moon crater
        X.beginPath();
        X.arc(mx + 7, my - 4, 8, 0, Math.PI * 2);
        X.fillStyle = 'rgba(240,160,10,.25)';
        X.fill();
        // Moon halo
        const mhG = rgrad(mx, my, 20, mx, my, 50, [0, 'rgba(253,230,138,.15)'], [1, 'transparent']);
        X.fillStyle = mhG;
        X.fillRect(mx - 55, my - 55, 110, 110);

        // ── 2. Back wall ──────────────────────────
        const bwPts = [p(0, 7, 0), p(9, 7, 0), p(9, 7, 4.6), p(0, 7, 4.6)];
        const bwG = lgrad(
          p(0, 7, 4.6)[0],
          p(0, 7, 4.6)[1],
          p(0, 7, 0)[0],
          p(0, 7, 0)[1],
          [0, '#e8e0f8'],
          [0.5, '#dfd6f4'],
          [1, '#d2c8ec'],
        );
        poly(bwPts, bwG, 'rgba(160,140,210,.3)', 0.5);
        // Subtle wall texture
        X.strokeStyle = 'rgba(200,190,230,.12)';
        X.lineWidth = 1;
        for (let i = 1; i < 9; i++) {
          const a = p(i, 7, 0),
            b = p(i, 7, 4.6);
          X.beginPath();
          X.moveTo(a[0], a[1]);
          X.lineTo(b[0], b[1]);
          X.stroke();
        }
        // Baseboard
        poly([p(0, 7, 0), p(9, 7, 0), p(9, 7, 0.14), p(0, 7, 0.14)], '#c4b8e8', null);

        // ── 3. Left wall ──────────────────────────
        const lwPts = [p(0, 0, 0), p(0, 7, 0), p(0, 7, 4.6), p(0, 0, 4.6)];
        const lwG = lgrad(
          p(0, 0, 4.6)[0],
          p(0, 0, 4.6)[1],
          p(0, 7, 0)[0],
          p(0, 7, 0)[1],
          [0, '#f8f4ff'],
          [0.6, '#f0eaff'],
          [1, '#e6defc'],
        );
        poly(lwPts, lwG, 'rgba(180,160,230,.25)', 0.5);
        // Texture
        X.strokeStyle = 'rgba(200,190,230,.1)';
        X.lineWidth = 0.8;
        for (let j = 1; j < 7; j++) {
          const a = p(0, j, 0),
            b = p(0, j, 4.6);
          X.beginPath();
          X.moveTo(a[0], a[1]);
          X.lineTo(b[0], b[1]);
          X.stroke();
        }
        // Baseboard
        poly([p(0, 0, 0), p(0, 7, 0), p(0, 7, 0.14), p(0, 0, 0.14)], '#d8d0f0', null);

        // ── 4. Floor ──────────────────────────────
        const flPts = [p(0, 0, 0), p(9, 0, 0), p(9, 7, 0), p(0, 7, 0)];
        const flG = lgrad(
          p(0, 0, 0)[0],
          p(0, 0, 0)[1],
          p(9, 7, 0)[0],
          p(9, 7, 0)[1],
          [0, '#cfc0f0'],
          [0.4, '#c4b4ec'],
          [0.8, '#b8a8e4'],
          [1, '#aca0dc'],
        );
        poly(flPts, flG, 'rgba(150,130,200,.2)', 0.5);
        // Floor grid
        X.strokeStyle = 'rgba(255,255,255,.055)';
        X.lineWidth = 0.7;
        for (let i = 1; i < 9; i++) {
          const a = p(i, 0, 0),
            b = p(i, 7, 0);
          X.beginPath();
          X.moveTo(a[0], a[1]);
          X.lineTo(b[0], b[1]);
          X.stroke();
        }
        for (let j = 1; j < 7; j++) {
          const a = p(0, j, 0),
            b = p(9, j, 0);
          X.beginPath();
          X.moveTo(a[0], a[1]);
          X.lineTo(b[0], b[1]);
          X.stroke();
        }

        // Rug
        X.save();
        X.globalAlpha = 0.55;
        poly(
          [p(2.4, 1.8, 0), p(6.8, 1.8, 0), p(6.8, 6.2, 0), p(2.4, 6.2, 0)],
          'rgba(139,92,246,.22)',
          'rgba(167,139,250,.4)',
          1.5,
        );
        X.restore();
        // Rug border
        X.strokeStyle = 'rgba(196,167,253,.35)';
        X.lineWidth = 0.8;
        poly(
          [p(2.55, 1.95, 0), p(6.65, 1.95, 0), p(6.65, 6.05, 0), p(2.55, 6.05, 0)],
          null,
          'rgba(196,167,253,.3)',
          1,
        );

        // ── 5. Window ──────────────────────────────
        // Window frame
        const wfO = 0.06; // offset from wall
        poly(
          [p(0, 1.1, 0.8), p(0, 5.6, 0.8), p(0, 5.6, 3.9), p(0, 1.1, 3.9)],
          '#e8e4f8',
          'rgba(190,175,230,.6)',
          3,
        );

        // Night sky in window
        const wpts = [p(0, 1.22, 0.94), p(0, 5.48, 0.94), p(0, 5.48, 3.76), p(0, 1.22, 3.76)];
        const wGrad = lgrad(
          p(0, 1.22, 3.76)[0],
          p(0, 1.22, 3.76)[1],
          p(0, 1.22, 0.94)[0],
          p(0, 1.22, 0.94)[1],
          [0, '#0c0530'],
          [0.4, '#12084a'],
          [0.8, '#180c5a'],
          [1, '#1e1060'],
        );
        poly(wpts, wGrad, null);

        // City skyline silhouette
        X.save();
        X.fillStyle = '#160840';
        const bldgs = [
          { y: 1.4, w: 0.3, h: 1.1 },
          { y: 1.75, w: 0.25, h: 0.8 },
          { y: 2.1, w: 0.35, h: 1.4 },
          { y: 2.5, w: 0.28, h: 1.0 },
          { y: 2.82, w: 0.32, h: 1.6 },
          { y: 3.18, w: 0.26, h: 1.1 },
          { y: 3.48, w: 0.38, h: 1.5 },
          { y: 3.9, w: 0.24, h: 0.9 },
          { y: 4.18, w: 0.3, h: 1.2 },
          { y: 4.52, w: 0.28, h: 1.0 },
          { y: 4.84, w: 0.2, h: 0.7 },
        ];
        bldgs.forEach(({ y, w, h }) => {
          const bl = p(0, y, 1),
            br = p(0, y + w, 1),
            tr = p(0, y + w, 1 + h * 0.7),
            tl = p(0, y, 1 + h * 0.7);
          poly([bl, br, tr, tl], '#0e0638', null);
          // Lit windows
          [
            [0.3, 0.5],
            [0.5, 0.7],
            [0.2, 0.8],
          ].forEach(([ty, oy]) => {
            if (Math.random() > 0.5) return;
            const lp = p(0, y + w * oy, 1 + h * ty * 0.7);
            X.fillStyle = Math.random() > 0.5 ? 'rgba(253,230,138,.55)' : 'rgba(147,197,253,.5)';
            X.fillRect(lp[0] + 0.5, lp[1] - 2.5, 3.5, 2.5);
          });
        });
        X.restore();

        // Moon reflection in window
        const wMx = p(0, 3.5, 3.1);
        X.beginPath();
        X.arc(wMx[0] + 1, wMx[1], 8, 0, Math.PI * 2);
        const wmG = rgrad(
          wMx[0] - 2,
          wMx[1] - 2,
          1,
          wMx[0] + 1,
          wMx[1],
          8,
          [0, '#fff8e0'],
          [0.6, '#fde68a'],
          [1, 'rgba(253,200,50,.3)'],
        );
        X.fillStyle = wmG;
        X.fill();
        // Star dots in window
        [
          [1.8, 3.2],
          [2.2, 2.5],
          [2.9, 3.5],
          [3.8, 2.8],
          [4.6, 3.0],
          [5.0, 2.3],
          [5.3, 3.4],
        ].forEach(([wy, wz]) => {
          const sp = p(0, wy, wz);
          X.beginPath();
          X.arc(sp[0] + 0.5, sp[1], 0.8, 0, Math.PI * 2);
          X.fillStyle = 'rgba(255,255,255,.7)';
          X.fill();
        });

        // Window curtains
        const curtainL = [p(0, 0.95, 0.75), p(0, 1.45, 0.75), p(0, 1.3, 3.95), p(0, 0.95, 3.95)];
        const curtainR = [p(0, 5.3, 0.75), p(0, 5.75, 0.75), p(0, 5.75, 3.95), p(0, 5.45, 3.95)];
        poly(curtainL, 'rgba(245,240,255,.85)', 'rgba(210,200,240,.5)', 1);
        poly(curtainR, 'rgba(245,240,255,.85)', 'rgba(210,200,240,.5)', 1);
        // Curtain folds
        X.strokeStyle = 'rgba(200,185,230,.4)';
        X.lineWidth = 1;
        [0.15, 0.3, 0.45, 0.6, 0.75, 0.9].forEach((t) => {
          const a = p(0, 0.95 + t * 0.5, 0.75),
            b = p(0, 0.95 + t * 0.5, 3.95);
          X.beginPath();
          X.moveTo(a[0], a[1]);
          X.lineTo(b[0], b[1]);
          X.stroke();
        });

        // Window dividers
        X.strokeStyle = '#d8d0f4';
        X.lineWidth = 4;
        const wdM = p(0, 3.35, 0.8),
          wdT = p(0, 3.35, 3.95);

        // Leaves
        function drawLeaf(cx2, cy2, angle, size, col) {
          X.save();
          X.translate(cx2, cy2);
          X.rotate(angle);
          X.fillStyle = col;
          X.beginPath();
          X.ellipse(0, -size * 0.5, size * 0.35, size * 0.65, 0, 0, Math.PI * 2);

          // Vein
          X.strokeStyle = 'rgba(0,80,0,.3)';
          X.lineWidth = 0.8;
          X.beginPath();
          X.moveTo(0, 0);
          X.lineTo(0, -size);
          X.stroke();
          X.restore();

        const flC = ['#fde68a', '#f9a8d4', '#a5f3fc', '#c4b5fd', '#bbf7d0', '#fde68a', '#f9a8d4'];

        for (let i = 0; i <= 8; i++) {

          const hG = rgrad(

        for (let i = 0; i <= 10; i++) {

        }

        // ── 13. Ambient atmosphere ────────────────
        // Room corner ambient (where walls meet)
        const caG = rgrad(
          p(0, 7, 0)[0],
          p(0, 7, 0)[1],
          5,
          p(0, 7, 0)[0],

        X.fillStyle = caG;
        X.fillRect(200, 100, 400, 300);

        // Monitor screen light reflection on near objects
        const mrG = rgrad(

          3,
          p(1.5, 2.0, 2.2)[0],
          p(1.5, 2.0, 2.2)[1] + 15,
          100,
          [0, 'rgba(96,165,250,.06)'],
          [1, 'transparent'],
        );
        X.fillStyle = mrG;
        X.fillRect(180, 260, 260, 180);
      }

      // Utility: lighten/darken hex color
      function shadeColor(hex, factor) {
        const r = parseInt(hex.slice(1, 3), 16),
          g = parseInt(hex.slice(3, 5), 16),
          b = parseInt(hex.slice(5, 7), 16);
        const nr = Math.min(255, Math.round(r * (1 + factor))),
          ng = Math.min(255, Math.round(g * (1 + factor))),
          nb = Math.min(255, Math.round(b * (1 + factor)));
        return `rgb(${nr},${ng},${nb})`;
      }
