<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>The Lounge v5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07041a;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center}
.app{width:860px}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(7,4,26,.95);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.logo{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--accent,#f0abfc)}
.logo em{color:var(--accent2,#c8a8e8);font-style:normal}
.nav{flex:1;display:flex;justify-content:center;gap:2px}
.tab{font-size:10px;font-weight:600;padding:4px 14px;border-radius:7px;color:#4a3d62;cursor:pointer;transition:all .15s}
.tab.on{background:rgba(255,255,255,.08);color:var(--accent,#f0abfc);border:1px solid rgba(255,255,255,.15)}
.lpill{font-size:9px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);display:flex;align-items:center;gap:5px}
.ldot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{box-shadow:0 0 4px #4ade80}50%{box-shadow:0 0 10px #4ade80;opacity:.6}}
.timebadge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12)}
.scene{position:relative;width:860px;height:500px;overflow:hidden}
canvas{position:absolute;top:0;left:0;display:block}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
/* characters */
.ch{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:all;cursor:pointer;transform:translateX(-50%) translateY(-100%)}
.ch:hover .ct{opacity:1;transform:translateY(0) scale(1)}
.ch:hover .ca{transform:translateY(-5px) scale(1.06)}
.ca{border-radius:50%;border:3px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:var(--fs,22px);background:var(--bg);position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.65),0 0 var(--gs,0px) var(--gc,transparent),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .2s}
.ca::before{content:'';position:absolute;top:-25%;left:-15%;width:50%;height:50%;background:radial-gradient(ellipse,rgba(255,255,255,.2) 0%,transparent 70%);border-radius:50%}
.cst{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;border:2px solid #07041a;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:900}
.ct{background:rgba(5,2,18,.94);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:3px 10px;font-size:9px;font-weight:700;color:var(--accent,#f0abfc);white-space:nowrap;opacity:0;transform:translateY(6px) scale(.9);transition:all .2s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(6px);text-align:center;line-height:1.5}
.ct small{color:rgba(255,255,255,.4);font-size:8px;font-weight:400;display:block}
.fw{animation:cfw 2.5s ease-in-out infinite}
.fi{animation:cfi 3.8s ease-in-out infinite}
.fl{animation:cfl 3s ease-in-out infinite}
.fs{animation:cfs 6s ease-in-out infinite}
@keyframes cfw{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 10px))}}
@keyframes cfi{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 6px))}}
@keyframes cfl{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 13px))}}
@keyframes cfs{0%,100%{transform:translateX(-50%) translateY(-100%) rotate(-2.5deg)}50%{transform:translateX(-50%) translateY(-100%) rotate(2.5deg)}}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:rgba(7,4,26,.95);border-top:1px solid rgba(255,255,255,.06)}
.pills{display:flex;gap:5px}
.pi{font-size:9px;font-weight:700;padding:2px 9px;border-radius:99px}
.pig{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.pip{background:rgba(255,255,255,.08);color:var(--accent,#f0abfc);border:1px solid rgba(255,255,255,.12)}
.pis{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.hint{font-size:9px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="logo">✦ <em>SQUAD</em> ✧</div>
    <div class="nav">
      <div class="tab on">🏠 Lounge</div>
      <div class="tab">💬 Stages</div>
      <div class="tab">📋 Projects</div>
      <div class="tab">⚙️ Settings</div>
    </div>
    <div class="timebadge" id="timebadge">—</div>
    <div class="lpill"><div class="ldot"></div>3 active</div>
  </div>
  <div class="scene">
    <canvas id="c" width="860" height="500"></canvas>
    <div id="hud"></div>
  </div>
  <div class="statusbar">
    <div class="pills">
      <span class="pi pig">● 3 active</span>
      <span class="pi pip">★ 1 lead</span>
      <span class="pi pis">○ 2 idle &nbsp;💤 2 sleeping</span>
    </div>
    <span class="hint">hover ตัวละคร · คลิกเพื่อเปิด Stage</span>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  TIME-BASED THEMES
// ══════════════════════════════════════════════
const now = new Date();
const H = now.getHours(), M = now.getMinutes();
const timeVal = H + M/60; // 0..24

function pickTheme(t){
  if(t>=5&&t<7.5)  return 'dawn';
  if(t>=7.5&&t<12) return 'morning';
  if(t>=12&&t<17)  return 'afternoon';
  if(t>=17&&t<20)  return 'evening';
  return 'night';
}
const THEME_NAME = pickTheme(timeVal);

const THEMES = {
  night:{
    label:'🌙 กลางคืน',
    accent:'#f0abfc', accent2:'#c8a8e8',
    // Sky
    skyTop:'#060318', skyMid:'#0d0728', skyBot:'#1a1040',
    hasMoon:true, hasSun:false,
    skyInWin:['#080428','#10083a','#180c54','#1e1060'],
    // Room
    wallBack:['#e8e0f8','#ddd6f2','#d0c8ea'],
    wallLeft:['#f5f0ff','#eee8fd','#e4dcf8'],
    floorA:'#cfc0f0', floorB:'#baaee4',
    // Lighting
    ambientColor:'rgba(160,130,255,.07)',
    lampWarm:true,
    curtainColor:'rgba(240,235,255,.82)',
    woodTop:'#c49060', woodFront:'#9a7040', woodSide:'#855e30',
    chairTop:'#e87050', chairFront:'#c85c3a', chairSide:'#a84828',
    bedTop:'#e8e0ff', bedSide:'#d0c8f0', blanket:'#b39be8',
  },
  dawn:{
    label:'🌅 เช้าตรู่',
    accent:'#ffa07a', accent2:'#ffb899',
    skyTop:'#1c052e', skyMid:'#8b1a4a', skyBot:'#ff6030',
    hasMoon:false, hasSun:true, sunY:0.82, sunColor:'#ff7043', sunGlow:'rgba(255,100,50,.25)',
    skyInWin:['#20062e','#9a1e50','#e03820','#ff7030'],
    wallBack:['#ffe8e0','#fdd8cc','#f8c8b8'],
    wallLeft:['#fff4ee','#ffece4','#ffe4d8'],
    floorA:'#e8d0b8', floorB:'#d4b898',
    ambientColor:'rgba(255,120,60,.09)',
    lampWarm:true,
    curtainColor:'rgba(255,240,235,.82)',
    woodTop:'#c89060', woodFront:'#a07040', woodSide:'#8a5e28',
    chairTop:'#e06040', chairFront:'#c04828', chairSide:'#a03018',
    bedTop:'#fff0e8', bedSide:'#f0d8c8', blanket:'#e8a080',
  },
  morning:{
    label:'🌤️ เช้า',
    accent:'#60c8f5', accent2:'#a8dcf5',
    skyTop:'#4a9fd4', skyMid:'#7ac0e8', skyBot:'#a8d8f0',
    hasMoon:false, hasSun:true, sunY:0.35, sunColor:'#fbbf24', sunGlow:'rgba(251,191,36,.3)',
    skyInWin:['#3a8ac0','#6ab4e0','#90ccf0','#b8e4f8'],
    wallBack:['#f8f4ee','#f2ece4','#ebe4da'],
    wallLeft:['#ffffff','#fcfaf7','#f8f4ef'],
    floorA:'#e0d8c0', floorB:'#ccc4aa',
    ambientColor:'rgba(255,220,120,.1)',
    lampWarm:false,
    curtainColor:'rgba(255,255,252,.82)',
    woodTop:'#c8a870', woodFront:'#a07840', woodSide:'#8a6430',
    chairTop:'#e87050', chairFront:'#c85c3a', chairSide:'#a84828',
    bedTop:'#f8f4ee', bedSide:'#e8e0d4', blanket:'#d0c8b0',
  },
  afternoon:{
    label:'☀️ บ่าย',
    accent:'#38b4f8', accent2:'#80cef8',
    skyTop:'#1a78c2', skyMid:'#3a9ae0', skyBot:'#70bef5',
    hasMoon:false, hasSun:true, sunY:0.12, sunColor:'#f59e0b', sunGlow:'rgba(245,158,11,.25)',
    skyInWin:['#1060a8','#3080cc','#58a4ec','#80c4f8'],
    wallBack:['#f8f5f0','#f2ede8','#ece7e0'],
    wallLeft:['#ffffff','#fdfcfa','#faf8f5'],
    floorA:'#ddd8c0','#d0ccb4',
    floorA:'#ddd8c0', floorB:'#ccc8b0',
    ambientColor:'rgba(255,230,150,.08)',
    lampWarm:false,
    curtainColor:'rgba(255,255,250,.82)',
    woodTop:'#d4b478', woodFront:'#a88448', woodSide:'#8c6c34',
    chairTop:'#e87050', chairFront:'#c85c3a', chairSide:'#a84828',
    bedTop:'#f4f0e8', bedSide:'#e4ddd0', blanket:'#c8c0a8',
  },
  evening:{
    label:'🌆 พระอาทิตย์ตก',
    accent:'#ffb347', accent2:'#ffcc80',
    skyTop:'#0a001c', skyMid:'#680a28', skyBot:'#ff4800',
    hasMoon:false, hasSun:true, sunY:0.78, sunColor:'#ff5722', sunGlow:'rgba(255,80,20,.3)',
    skyInWin:['#100020','#780820','#d82800','#ff5000','#ff8020'],
    wallBack:['#ffe8d8','#ffd8c4','#f8c8b0'],
    wallLeft:['#fff4ec','#ffeee4','#ffe8dc'],
    floorA:'#d8c0a0', floorB:'#c4a888',
    ambientColor:'rgba(255,100,30,.1)',
    lampWarm:true,
    curtainColor:'rgba(255,245,238,.82)',
    woodTop:'#c89060', woodFront:'#a07040', woodSide:'#8a5e28',
    chairTop:'#d85030', chairFront:'#b83a1a', chairSide:'#983008',
    bedTop:'#fff0e4', bedSide:'#eedd cc', blanket:'#e09060',
  },
};
const T = THEMES[THEME_NAME];

// Apply CSS accent
document.getElementById('app').style.setProperty('--accent', T.accent);
document.getElementById('app').style.setProperty('--accent2', T.accent2);
document.getElementById('timebadge').textContent = T.label;

// ══════════════════════════════════════════════
//  PROJECTION
// ══════════════════════════════════════════════
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const S=40, OX=190, OY=446;
function p(wx,wy,wz){return [OX+wx*S+wy*S*.5, OY-wy*S*.5-wz*S]}

// ── Helpers ──
function fill4(a,b,c,d,col,strokeCol,lw){
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();
  if(col){ctx.fillStyle=col;ctx.fill()}
  if(strokeCol){ctx.strokeStyle=strokeCol;ctx.lineWidth=lw||.6;ctx.stroke()}
}
function lg(x0,y0,x1,y1,stops){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));return g
}
function rg(cx,cy,r0,r1,stops){
  const g=ctx.createRadialGradient(cx,cy,r0,cx,cy,r1);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));return g
}
function box(wx,wy,wz,w,d,h,ct,cf,cr,stroke){
  const s=stroke||'rgba(0,0,0,.1)';
  if(ct)fill4(p(wx,wy,wz+h),p(wx+w,wy,wz+h),p(wx+w,wy+d,wz+h),p(wx,wy+d,wz+h),ct,s);
  if(cf)fill4(p(wx,wy,wz),p(wx+w,wy,wz),p(wx+w,wy,wz+h),p(wx,wy,wz+h),cf,s);
  if(cr)fill4(p(wx+w,wy,wz),p(wx+w,wy+d,wz),p(wx+w,wy+d,wz+h),p(wx+w,wy,wz+h),cr,s);
}
function shadow(wx,wy,w,d,a){
  ctx.save();ctx.globalAlpha=a||.15;
  fill4(p(wx,wy,0),p(wx+w,wy,0),p(wx+w,wy+d,0),p(wx,wy+d,0),'rgba(60,30,90,.5)',null);
  ctx.restore()
}

// ══════════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,860,500);

  // ── Sky ──────────────────────────────────
  const skyG=lg(430,0,430,500,[[0,T.skyTop],[.35,T.skyMid],[1,T.skyBot]]);
  ctx.fillStyle=skyG; ctx.fillRect(0,0,860,500);

  // Stars (only night/dawn)
  if(THEME_NAME==='night'||THEME_NAME==='dawn'){
    [[60,28],[110,14],[180,32],[280,18],[360,26],[450,8],[540,20],[640,12],[710,30],[790,8],[830,22]].forEach(([sx,sy])=>{
      ctx.beginPath();ctx.arc(sx,sy,1.1,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();
    });
  }

  // Sun / Moon
  if(T.hasMoon){
    const mx=695,my=38;
    const mg=rg(mx-5,my-4,2,mx,my,21,[[0,'#fff8e0'],[.6,'#fde68a'],[1,'#f4a020']]);
    ctx.beginPath();ctx.arc(mx,my,21,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();
    ctx.beginPath();ctx.arc(mx+7,my-3,11,0,Math.PI*2);ctx.fillStyle='rgba(10,4,30,.85)';ctx.fill();
    // halo
    const mhg=rg(mx,my,19,mx,my,52,[[0,'rgba(253,230,138,.18)'],[1,'transparent']]);
    ctx.fillStyle=mhg;ctx.beginPath();ctx.arc(mx,my,52,0,Math.PI*2);ctx.fill();
  }
  if(T.hasSun){
    const sy=T.sunY; const sunScreenX=700, sunScreenY=Math.round(sy*220+20);
    // Glow
    const sg=rg(sunScreenX,sunScreenY,8,sunScreenX,sunScreenY,80,[[0,T.sunGlow||'rgba(255,180,50,.3)'],[1,'transparent']]);
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sunScreenX,sunScreenY,80,0,Math.PI*2);ctx.fill();
    // Sun disc
    const sdg=rg(sunScreenX-4,sunScreenY-4,2,sunScreenX,sunScreenY,18,[[0,'#fffde0'],[.5,T.sunColor],[1,T.sunColor+'bb']]);
    ctx.beginPath();ctx.arc(sunScreenX,sunScreenY,18,0,Math.PI*2);ctx.fillStyle=sdg;ctx.fill();
  }

  // ── Back wall ──────────────────────────────
  const bw=T.wallBack;
  const bwG=lg(p(0,7,4.5)[0],p(0,7,4.5)[1],p(0,7,0)[0],p(0,7,0)[1],[[0,bw[0]],[.55,bw[1]],[1,bw[2]]]);
  fill4(p(0,7,0),p(9,7,0),p(9,7,4.5),p(0,7,4.5),bwG,'rgba(0,0,0,.08)');
  // subtle grid
  ctx.strokeStyle='rgba(0,0,0,.04';ctx.lineWidth=.7;
  for(let i=1;i<9;i++){const a=p(i,7,0),b=p(i,7,4.5);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  // baseboard
  fill4(p(0,7,0),p(9,7,0),p(9,7,.12),p(0,7,.12),'rgba(0,0,0,.12)',null);

  // ── Left wall ──────────────────────────────
  const lw=T.wallLeft;
  const lwG=lg(p(0,0,4.5)[0],p(0,0,4.5)[1],p(0,7,0)[0],p(0,7,0)[1],[[0,lw[0]],[.5,lw[1]],[1,lw[2]]]);
  fill4(p(0,0,0),p(0,7,0),p(0,7,4.5),p(0,0,4.5),lwG,'rgba(0,0,0,.06)');
  ctx.strokeStyle='rgba(0,0,0,.03';ctx.lineWidth=.7;
  for(let j=1;j<7;j++){const a=p(0,j,0),b=p(0,j,4.5);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  fill4(p(0,0,0),p(0,7,0),p(0,7,.12),p(0,0,.12),'rgba(0,0,0,.1)',null);

  // ── Floor ──────────────────────────────────
  const flG=lg(p(0,0,0)[0],p(0,0,0)[1],p(9,7,0)[0],p(9,7,0)[1],[[0,T.floorA],[.5,T.floorA+'dd'],[1,T.floorB]]);
  fill4(p(0,0,0),p(9,0,0),p(9,7,0),p(0,7,0),flG,'rgba(0,0,0,.06)');
  ctx.strokeStyle='rgba(255,255,255,.05';ctx.lineWidth=.7;
  for(let i=1;i<9;i++){const a=p(i,0,0),b=p(i,7,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  for(let j=1;j<7;j++){const a=p(0,j,0),b=p(9,j,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}

  // Rug
  ctx.save();ctx.globalAlpha=.4;
  fill4(p(2.3,1.7,0),p(6.9,1.7,0),p(6.9,6.3,0),p(2.3,6.3,0),'rgba(160,120,220,.25)',null);
  ctx.restore();
  ctx.strokeStyle='rgba(180,140,240,.3)';ctx.lineWidth=1.2;
  fill4(p(2.3,1.7,0),p(6.9,1.7,0),p(6.9,6.3,0),p(2.3,6.3,0),null,'rgba(180,140,240,.3)',1.2);
  fill4(p(2.5,1.9,0),p(6.7,1.9,0),p(6.7,6.1,0),p(2.5,6.1,0),null,'rgba(180,140,240,.15)',.7);

  // Ambient light overlay
  if(T.ambientColor){
    const ag=rg(430,350,20,430,350,400,[[0,T.ambientColor],[1,'transparent']]);
    ctx.fillStyle=ag;ctx.fillRect(0,0,860,500);
  }

  // ── WINDOW ─────────────────────────────────
  // Outer frame
  fill4(p(0,1.0,.75),p(0,5.7,.75),p(0,5.7,4.0),p(0,1.0,4.0),lw[0],'rgba(0,0,0,.08)',3);
  // Sky pane
  const wPts=[p(0,1.18,.9),p(0,5.52,.9),p(0,5.52,3.85),p(0,1.18,3.85)];
  const wsG=lg(wPts[2][0],wPts[2][1],wPts[0][0],wPts[0][1],T.skyInWin.map((c,i)=>[i/(T.skyInWin.length-1),c]));
  fill4(wPts[0],wPts[1],wPts[2],wPts[3],wsG,null);

  // Buildings in window
  const bldgs=[[1.3,3.3,1.0],[1.7,3.6,1.5],[2.1,3.85,1.1],[2.55,4.0,1.7],[3.0,3.75,1.2],[3.4,4.15,1.6],[3.85,3.65,1.0],[4.25,4.2,1.4],[4.7,3.8,1.1],[5.1,4.0,.9]];
  bldgs.forEach(([by,yd,bh])=>{
    const zb=.9, col=THEME_NAME==='night'?'rgba(12,5,40,.9)':'rgba(20,15,50,.5)';
    fill4(p(0,by,zb),p(0,by+.28,zb),p(0,by+.28,zb+bh*.55),p(0,by,zb+bh*.55),col,null);
    // Windows in buildings
    if(THEME_NAME==='night'||THEME_NAME==='dawn'){
      ctx.fillStyle='rgba(253,230,138,.5)';
      [.2,.45,.65].forEach(tz=>{
        if(Math.random()>.45){const lp=p(0,by+.07,zb+bh*tz*.55);ctx.fillRect(lp[0]+.5,lp[1]-2,3,2)}
      });
    }
  });

  // Moon/sun in window
  if(T.hasMoon){
    const wm=p(0,3.6,3.1);
    const wmg=rg(wm[0]+.5,wm[1],1,wm[0]+.5,wm[1],9,[[0,'#fff8e0'],[.7,'#fde68a'],[1,'rgba(253,210,50,.2)']]);
    ctx.beginPath();ctx.arc(wm[0]+.5,wm[1],9,0,Math.PI*2);ctx.fillStyle=wmg;ctx.fill();
  }
  if(T.hasSun){
    const sunWy=1.2+T.sunY*(5.52-1.18), sunWz=T.sunY<.5?3.85-T.sunY*2:3.85-(T.sunY)*2;
    const sw=p(0,sunWy,Math.max(.95,sunWz));

    ctx.fillStyle=fgrd;ctx.beginPath();ctx.arc(fc[0],fc[1],9,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<=11;i++){
    const wx2=i/11*8.7+.1, fc=p(wx2,7,4.38);
    const c=flCols[(i+3)%5];
    ctx.beginPath();ctx.arc(fc[0],fc[1],2.5,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
    const fgrd=rg(fc[0],fc[1],1,fc[0],fc[1],9,[[0,c+'99'],[1,'transparent']]);
    ctx.fillStyle=fgrd;ctx.beginPath();ctx.arc(fc[0],fc[1],9,0,Math.PI*2);ctx.fill();
  }
}
