<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>The Lounge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07041a;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center}
.app{width:860px}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(5,2,14,.96);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--ac,#f0abfc)}
.logo em{color:var(--ac2,#c8a8e8);font-style:normal}
.nav{flex:1;display:flex;justify-content:center;gap:2px}
.tab{font-size:10px;font-weight:600;padding:4px 13px;border-radius:7px;color:#3d3060;cursor:pointer}
.tab.on{background:rgba(255,255,255,.08);color:var(--ac,#f0abfc);border:1px solid rgba(255,255,255,.14)}
.tpill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1)}
.lpill{font-size:9px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2);display:flex;align-items:center;gap:4px}
.ldot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{box-shadow:0 0 4px #4ade80}50%{box-shadow:0 0 9px #4ade80;opacity:.6}}
.scene{position:relative;width:860px;height:500px;overflow:hidden}
canvas{position:absolute;top:0;left:0;display:block}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.ch{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:all;cursor:pointer;transform:translateX(-50%) translateY(-100%)}
.ch:hover .ct{opacity:1;transform:translateY(0) scale(1)}
.ch:hover .ca{transform:translateY(-5px) scale(1.07)}
.ca{border-radius:50%;border:3px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:var(--fs,22px);background:var(--bg);position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 var(--gs,0px) var(--gc,transparent),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .2s}
.ca::before{content:'';position:absolute;top:-25%;left:-15%;width:50%;height:50%;background:radial-gradient(ellipse,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%}
.cst{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;border:2px solid #05020e;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:900}
.ct{background:rgba(5,2,14,.94);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:3px 10px;font-size:9px;font-weight:700;color:var(--ac,#f0abfc);white-space:nowrap;opacity:0;transform:translateY(6px) scale(.9);transition:all .2s cubic-bezier(.34,1.56,.64,1);text-align:center;line-height:1.5}
.ct small{color:rgba(255,255,255,.38);font-size:8px;font-weight:400;display:block}
.fw{animation:cfw 2.5s ease-in-out infinite}
.fi{animation:cfi 3.8s ease-in-out infinite}
.fl{animation:cfl 3s ease-in-out infinite}
.fs{animation:cfs 6s ease-in-out infinite}
@keyframes cfw{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 10px))}}
@keyframes cfi{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 6px))}}
@keyframes cfl{0%,100%{transform:translateX(-50%) translateY(-100%)}50%{transform:translateX(-50%) translateY(calc(-100% - 13px))}}
@keyframes cfs{0%,100%{transform:translateX(-50%) translateY(-100%) rotate(-2.5deg)}50%{transform:translateX(-50%) translateY(-100%) rotate(2.5deg)}}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:rgba(5,2,14,.96);border-top:1px solid rgba(255,255,255,.05)}
.pills{display:flex;gap:5px}
.pi{font-size:9px;font-weight:700;padding:2px 9px;border-radius:99px}
.pig{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.2)}
.pip{background:rgba(255,255,255,.07);color:var(--ac,#f0abfc);border:1px solid rgba(255,255,255,.12)}
.pis{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.18)}
.hint{font-size:9px;color:rgba(255,255,255,.18)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="logo">✦ <em>SQUAD</em> ✧</div>
    <div class="nav">
      <div class="tab on">🏠 Lounge</div>
      <div class="tab">💬 Stages</div>
      <div class="tab">📋 Projects</div>
      <div class="tab">⚙️ Settings</div>
    </div>
    <div class="tpill" id="tbadge"></div>
    <div class="lpill"><div class="ldot"></div>3 active</div>
  </div>
  <div class="scene">
    <canvas id="c" width="860" height="500"></canvas>
    <div id="hud"></div>
  </div>
  <div class="sbar">
    <div class="pills">
      <span class="pi pig">● 3 active</span>
      <span class="pi pip">★ 1 lead</span>
      <span class="pi pis">○ 2 idle &nbsp;💤 2 sleeping</span>
    </div>
    <span class="hint">hover ตัวละคร · คลิกเพื่อเปิด Stage</span>
  </div>
</div>

<script>
// ─── Time theme ────────────────────────────────
const H = new Date().getHours();
function getThemeName(h){
  if(h>=5&&h<8)   return 'dawn';
  if(h>=8&&h<12)  return 'morning';
  if(h>=12&&h<17) return 'afternoon';
  if(h>=17&&h<20) return 'evening';
  return 'night';
}
const TN = getThemeName(H);

// All theme values — NO syntax errors guaranteed
const THEMES = {};

THEMES.night = {
  label:'🌙 กลางคืน', ac:'#f0abfc', ac2:'#c8a8e8',
  skyTop:'#060318', skyMid:'#0d0728', skyBot:'#1a1040',
  hasMoon:true, hasSun:false, sunY:0, sunCol:'#fff', sunGlow:'transparent',
  winSky:['#080428','#10083a','#180c54','#1e1060'],
  bwA:'#ece4fc', bwB:'#e0d8f5', bwC:'#d4ccea',
  lwA:'#f8f4ff', lwB:'#f0eafd', lwC:'#e6defc',
  flA:'#cfc0f0', flB:'#baaee4',
  curtain:'rgba(245,240,255,.83)',
  woodT:'#c49060', woodF:'#9a7040', woodS:'#855e30',
  chairT:'#e87050', chairF:'#c85c3a', chairS:'#a84828',
  bedTop:'#eee8ff', bedS:'#d8d0f0', blanket:'#b39be8',
  amb:'rgba(160,130,255,.06)', lampOn:true
};
THEMES.dawn = {
  label:'🌅 เช้าตรู่', ac:'#ffa07a', ac2:'#ffb899',
  skyTop:'#1c052e', skyMid:'#8b1a4a', skyBot:'#ff6030',
  hasMoon:false, hasSun:true, sunY:0.82, sunCol:'#ff7043', sunGlow:'rgba(255,100,50,.28)',
  winSky:['#20062e','#9a1e50','#e03820','#ff7030'],
  bwA:'#ffe8e0', bwB:'#fdd8cc', bwC:'#f8c8b8',
  lwA:'#fff4ee', lwB:'#ffece4', lwC:'#ffe4d8',
  flA:'#e8d0b8', flB:'#d4b898',
  curtain:'rgba(255,240,235,.83)',
  woodT:'#c89060', woodF:'#a07040', woodS:'#8a5e28',
  chairT:'#e06040', chairF:'#c04828', chairS:'#a03018',
  bedTop:'#fff0e8', bedS:'#f0d8c8', blanket:'#e8a080',
  amb:'rgba(255,120,60,.09)', lampOn:true
};
THEMES.morning = {
  label:'🌤️ เช้า', ac:'#38b4f8', ac2:'#88cef8',
  skyTop:'#4a9fd4', skyMid:'#7ac0e8', skyBot:'#a8d8f0',
  hasMoon:false, hasSun:true, sunY:0.35, sunCol:'#fbbf24', sunGlow:'rgba(251,191,36,.3)',
  winSky:['#3a8ac0','#6ab4e0','#90ccf0','#b8e4f8'],
  bwA:'#f8f4ee', bwB:'#f2ece4', bwC:'#ebe4da',
  lwA:'#ffffff', lwB:'#fcfaf7', lwC:'#f8f4ef',
  flA:'#e0d8c0', flB:'#ccc4aa',
  curtain:'rgba(255,255,252,.83)',
  woodT:'#c8a870', woodF:'#a07840', woodS:'#8a6430',
  chairT:'#e87050', chairF:'#c85c3a', chairS:'#a84828',
  bedTop:'#f8f4ee', bedS:'#e8e0d4', blanket:'#d0c8b0',
  amb:'rgba(255,220,120,.08)', lampOn:false
};
THEMES.afternoon = {
  label:'☀️ บ่าย', ac:'#38b4f8', ac2:'#80cef8',
  skyTop:'#1a78c2', skyMid:'#3a9ae0', skyBot:'#70bef5',
  hasMoon:false, hasSun:true, sunY:0.12, sunCol:'#f59e0b', sunGlow:'rgba(245,158,11,.25)',
  winSky:['#1060a8','#3080cc','#58a4ec','#80c4f8'],
  bwA:'#f8f5f0', bwB:'#f2ede8', bwC:'#ece7e0',
  lwA:'#ffffff', lwB:'#fdfcfa', lwC:'#faf8f5',
  flA:'#ddd8c0', flB:'#ccc8b0',
  curtain:'rgba(255,255,250,.83)',
  woodT:'#d4b478', woodF:'#a88448', woodS:'#8c6c34',
  chairT:'#e87050', chairF:'#c85c3a', chairS:'#a84828',
  bedTop:'#f4f0e8', bedS:'#e4ddd0', blanket:'#c8c0a8',
  amb:'rgba(255,230,150,.07)', lampOn:false
};
THEMES.evening = {
  label:'🌆 พระอาทิตย์ตก', ac:'#ffb347', ac2:'#ffcc80',
  skyTop:'#0a001c', skyMid:'#680a28', skyBot:'#ff4800',
  hasMoon:false, hasSun:true, sunY:0.78, sunCol:'#ff5722', sunGlow:'rgba(255,80,20,.3)',
  winSky:['#100020','#780820','#d82800','#ff5000','#ff8020'],
  bwA:'#ffe8d8', bwB:'#ffd8c4', bwC:'#f8c8b0',
  lwA:'#fff4ec', lwB:'#ffeee4', lwC:'#ffe8dc',
  flA:'#d8c0a0', flB:'#c4a888',
  curtain:'rgba(255,245,238,.83)',
  woodT:'#c89060', woodF:'#a07040', woodS:'#8a5e28',
  chairT:'#d85030', chairF:'#b83a1a', chairS:'#983008',
  bedTop:'#fff0e4', bedS:'#eeddd0', blanket:'#e09060',
  amb:'rgba(255,100,30,.1)', lampOn:true
};

const T = THEMES[TN];
document.getElementById('app').style.setProperty('--ac', T.ac);
document.getElementById('app').style.setProperty('--ac2', T.ac2);
document.getElementById('tbadge').textContent = T.label;

// ─── Projection ───────────────────────────────
const cv = document.getElementById('c');
const X  = cv.getContext('2d');
const S=40, OX=190, OY=446;
function p(wx,wy,wz){ return [OX+wx*S+wy*S*.5, OY-wy*S*.5-wz*S]; }

// ─── Helpers ──────────────────────────────────
function Q(a,b,c,d,fill,stroke,lw){
  X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.lineTo(c[0],c[1]);X.lineTo(d[0],d[1]);X.closePath();
  if(fill  ){X.fillStyle=fill;X.fill();}
  if(stroke){X.strokeStyle=stroke;X.lineWidth=lw||.6;X.stroke();}
}
function LG(x0,y0,x1,y1,stops){
  const g=X.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([o,c])=>g.addColorStop(o,c));
  return g;
}
function RG(x0,y0,r0,x1,y1,r1,stops){
  const g=X.createRadialGradient(x0,y0,r0,x1,y1,r1);
  stops.forEach(([o,c])=>g.addColorStop(o,c));
  return g;
}
function BOX(wx,wy,wz,w,d,h,cT,cF,cR){
  const st='rgba(0,0,0,.1)';
  if(cT) Q(p(wx,wy,wz+h),p(wx+w,wy,wz+h),p(wx+w,wy+d,wz+h),p(wx,wy+d,wz+h),cT,st);
  if(cF) Q(p(wx,wy,wz),p(wx+w,wy,wz),p(wx+w,wy,wz+h),p(wx,wy,wz+h),cF,st);
  if(cR) Q(p(wx+w,wy,wz),p(wx+w,wy+d,wz),p(wx+w,wy+d,wz+h),p(wx+w,wy,wz+h),cR,st);
}
function SHD(wx,wy,w,d,a){
  X.save();X.globalAlpha=a||.15;
  Q(p(wx,wy,0),p(wx+w,wy,0),p(wx+w,wy+d,0),p(wx,wy+d,0),'rgba(40,20,80,.55)',null);
  X.restore();
}

// ─── DRAW ─────────────────────────────────────
function draw(){
  X.clearRect(0,0,860,500);

  // Sky
  const skG=LG(430,0,430,500,[[0,T.skyTop],[.35,T.skyMid],[1,T.skyBot]]);
  X.fillStyle=skG; X.fillRect(0,0,860,500);

  // Stars
  if(TN==='night'||TN==='dawn'){
    [[60,26],[115,12],[185,34],[275,16],[365,24],[455,7],[545,19],[642,11],[712,28],[792,7],[835,21]].forEach(([sx,sy])=>{
      X.beginPath();X.arc(sx,sy,1.1,0,Math.PI*2);X.fillStyle='rgba(255,255,255,.72)';X.fill();
    });
  }

  // Moon
  if(T.hasMoon){
    const [mx,my]=[696,38];
    X.beginPath();X.arc(mx,my,21,0,Math.PI*2);
    X.fillStyle=RG(mx-5,my-4,2,mx,my,21,[[0,'#fff8e0'],[.6,'#fde68a'],[1,'#f4a020']]);
    X.fill();
    X.beginPath();X.arc(mx+7,my-3,11,0,Math.PI*2);
    X.fillStyle='rgba(8,3,26,.84)';X.fill();
    X.fillStyle=RG(mx,my,19,mx,my,52,[[0,'rgba(253,230,138,.18)'],[1,'transparent']]);
    X.beginPath();X.arc(mx,my,52,0,Math.PI*2);X.fill();
  }

  // Sun
  if(T.hasSun){
    const sx2=700, sy2=Math.round(T.sunY*210+15);
    X.fillStyle=RG(sx2,sy2,7,sx2,sy2,80,[[0,T.sunGlow],[1,'transparent']]);
    X.beginPath();X.arc(sx2,sy2,80,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx2,sy2,18,0,Math.PI*2);
    X.fillStyle=RG(sx2-4,sy2-4,2,sx2,sy2,18,[[0,'#fffde8'],[.5,T.sunCol],[1,T.sunCol+'aa']]);
    X.fill();
  }

  // ── Back wall ──
  Q(p(0,7,0),p(9,7,0),p(9,7,4.5),p(0,7,4.5),
    LG(p(0,7,4.5)[0],p(0,7,4.5)[1],p(0,7,0)[0],p(0,7,0)[1],[[0,T.bwA],[.55,T.bwB],[1,T.bwC]]),
    'rgba(0,0,0,.07)');
  X.strokeStyle='rgba(0,0,0,.035';X.lineWidth=.7;
  for(let i=1;i<9;i++){const a=p(i,7,0),b=p(i,7,4.5);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();}
  // baseboard
  Q(p(0,7,0),p(9,7,0),p(9,7,.13),p(0,7,.13),'rgba(0,0,0,.12)',null);

  // ── Left wall ──
  Q(p(0,0,0),p(0,7,0),p(0,7,4.5),p(0,0,4.5),
    LG(p(0,0,4.5)[0],p(0,0,4.5)[1],p(0,7,0)[0],p(0,7,0)[1],[[0,T.lwA],[.5,T.lwB],[1,T.lwC]]),
    'rgba(0,0,0,.05)');
  X.strokeStyle='rgba(0,0,0,.025';X.lineWidth=.7;
  for(let j=1;j<7;j++){const a=p(0,j,0),b=p(0,j,4.5);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();}
  Q(p(0,0,0),p(0,7,0),p(0,7,.13),p(0,0,.13),'rgba(0,0,0,.1)',null);

  // ── Floor ──
  Q(p(0,0,0),p(9,0,0),p(9,7,0),p(0,7,0),
    LG(p(0,0,0)[0],p(0,0,0)[1],p(9,7,0)[0],p(9,7,0)[1],[[0,T.flA],[.55,T.flA+'cc'],[1,T.flB]]),
    'rgba(0,0,0,.05)');
  X.strokeStyle='rgba(255,255,255,.05';X.lineWidth=.7;
  for(let i=1;i<9;i++){const a=p(i,0,0),b=p(i,7,0);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();}
  for(let j=1;j<7;j++){const a=p(0,j,0),b=p(9,j,0);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();}
  // Rug
  X.save();X.globalAlpha=.4;
  Q(p(2.3,1.7,0),p(6.9,1.7,0),p(6.9,6.3,0),p(2.3,6.3,0),'rgba(150,110,220,.22)',null);
  X.restore();
  Q(p(2.3,1.7,0),p(6.9,1.7,0),p(6.9,6.3,0),p(2.3,6.3,0),null,'rgba(170,130,240,.3)',1.2);
  Q(p(2.5,1.9,0),p(6.7,1.9,0),p(6.7,6.1,0),p(2.5,6.1,0),null,'rgba(170,130,240,.15)',.7);

  // Ambient
  if(T.amb){
    X.fillStyle=RG(430,350,10,430,350,380,[[0,T.amb],[1,'transparent']]);
    X.fillRect(0,0,860,500);
  }

  // ── Window ─────────────────────────────────
  // Outer frame
  Q(p(0,.95,.72),p(0,5.75,.72),p(0,5.75,4.02),p(0,.95,4.02),T.lwA,'rgba(0,0,0,.07)',3);
  // Sky pane
  const wsC=T.winSky;
  const wA=p(0,1.1,.88), wB=p(0,5.6,.88), wC=p(0,5.6,3.88), wD=p(0,1.1,3.88);
  Q(wA,wB,wC,wD,
    LG(wD[0],wD[1],wA[0],wA[1],wsC.map((c,i)=>[i/(wsC.length-1),c])),
    null);

  // Buildings in window
  const bldgs2=[[1.3,3.2,1.1],[1.65,3.55,1.5],[2.05,3.8,1.2],[2.5,3.95,1.7],[2.95,3.7,1.1],[3.35,4.1,1.65],[3.8,3.6,1.0],[4.2,4.15,1.4],[4.65,3.75,1.1],[5.05,3.95,.9]];
  bldgs2.forEach(([by2,yd,bh])=>{
    const bcol=TN==='night'?'rgba(10,4,38,.9)':(TN==='dawn'||TN==='evening')?'rgba(15,5,40,.65)':'rgba(20,30,60,.4)';
    Q(p(0,by2,.88),p(0,by2+.28,.88),p(0,by2+.28,.88+bh*.55),p(0,by2,.88+bh*.55),bcol,null);
    if(TN==='night'||TN==='dawn'){
      X.fillStyle='rgba(253,230,138,.48)';
      [.2,.45,.65].forEach(tz=>{
        if(Math.random()>.5){const lp=p(0,by2+.07,.88+bh*tz*.55);X.fillRect(lp[0]+.5,lp[1]-2,3,2);}
      });
    }
  });

  // Moon / sun in window
  if(T.hasMoon){
    const wm=p(0,3.5,3.05);
    X.beginPath();X.arc(wm[0]+.5,wm[1],8,0,Math.PI*2);
    X.fillStyle=RG(wm[0]-1,wm[1]-1,1,wm[0]+.5,wm[1],8,[[0,'#fff8e0'],[.7,'#fde68a'],[1,'rgba(253,210,50,.2)']]);
    X.fill();
  }
  if(T.hasSun){
    const sunWy=1.15+T.sunY*(5.6-1.1);
    const sunWz=Math.max(.95, T.sunY<.5 ? 3.85-T.sunY*2 : 3.85-T.sunY*1.5);
    const sw=p(0,sunWy,sunWz);
    X.fillStyle=RG(sw[0]+.5,sw[1],8,sw[0]+.5,sw[1],28,[[0,T.sunGlow],[1,'transparent']]);
    X.beginPath();X.arc(sw[0]+.5,sw[1],28,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sw[0]+.5,sw[1],10,0,Math.PI*2);
    X.fillStyle=RG(sw[0]-2,sw[1]-2,1,sw[0]+.5,sw[1],10,[[0,'#fffde8'],[.5,T.sunCol],[1,T.sunCol+'88']]);
    X.fill();
  }
  if(TN==='night'){
    [[1.8,3.1],[2.2,2.55],[3.0,3.3],[3.9,2.85],[4.5,3.05],[5.1,2.4],[5.3,3.3]].forEach(([wy2,wz2])=>{
      const sp=p(0,wy2,wz2);X.beginPath();X.arc(sp[0]+.5,sp[1],.8,0,Math.PI*2);
      X.fillStyle='rgba(255,255,255,.65)';X.fill();
    });
  }

  // Window dividers

    el.style.left=sx+'px'; el.style.top=sy+'px';
    el.innerHTML=`
      <div class="ca" style="width:${ch.sz}px;height:${ch.sz}px;--bg:${ch.bg};--bc:${ch.bc};--gc:${ch.gc};--gs:${ch.gs}px;--fs:${ch.fs}px;${ch.sleep?'filter:brightness(.55) saturate(.4)':''}">
        ${ch.em}
        <div class="cst" style="background:${ch.dBg};color:${ch.dFg};">${ch.dT}</div>
      </div>
      <div class="ct" style="--ac:${ch.bc}">${ch.name}<small>${ch.role}</small></div>`;
    hud.appendChild(el);
  });
}

try{ draw(); } catch(e){ console.error('draw error:',e.message,e); }
placeChars();
</script>
</body>
